  <script type="text/babel" data-presets="react">
const { useState, useReducer, useEffect, useRef } = React;

/* ============================================================
   Utilidades
   ============================================================ */
const fmt = (n) => "$ " + Math.round(n).toLocaleString("es-CO");
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const TARIFA_PCT = { garantizado: 0.08, gestion: 0.04 };
const tarifaDe = (canon, plan) => Math.round((canon * TARIFA_PCT[plan]) / 1000) * 1000;
const netoDe = (inm) => inm.canon - tarifaDe(inm.canon, inm.plan);

/* ============================================================
   Datos de ejemplo precargados (julio 2026, hoy es 4 de julio)
   ============================================================ */
const INMUEBLES_INICIALES = [
  {

  },

      { fecha: "20 may", concepto: "Recaudo transferido", monto: 912000 },
    ],

];

/* ============================================================
   Simulador: guiones de comportamiento por inquilino
   ============================================================ */
const ESCENARIOS = {
  cumplido: ["puntual", "puntual", "tarde"],
  efectivo: ["tarde", "puntual", "tarde"],
  riesgo:   ["mora", "tarde", "mora"],
  nuevo:    ["puntual", "tarde", "puntual"],
};

function simularMes(inmuebles, mesIdxNuevo, anio) {
  const mesNombre = cap(MESES[mesIdxNuevo]) + " " + anio;
  const mesAbrev = MESES[mesIdxNuevo].slice(0, 3);
  const eventos = [];
  let totalAdelantado = 0;
  let gestionesHechas = 0;

  const nuevos = inmuebles.map((inm) => {
    const tarifa = tarifaDe(inm.canon, inm.plan);
    const neto = inm.canon - tarifa;
    const esc = ESCENARIOS[inm.perfil][mesIdxNuevo % 3];
    const viaPago = inm.inquilino.metodo === "efectivo"
      ? "en efectivo en un punto Efecty"
      : "por link de pago";
    const historial = [...inm.historial];
    const gestiones = [];
    let cobro, desembolso;

    // Día 1: si el plan es garantizado, el dueño recibe su plata pase lo que pase
    if (inm.plan === "garantizado") {
      eventos.push({
        dia: 1, tipo: "desembolso",
        titulo: "Adelantamos " + fmt(neto) + " a tu cuenta",
        detalle: inm.nombre + " · canon " + fmt(inm.canon) + " − tarifa " + fmt(tarifa),
      });
      historial.push({ fecha: "1 " + mesAbrev, concepto: "Adelanto Rentia", monto: neto });
      totalAdelantado += neto;
      desembolso = { estado: "adelantado", texto: "Adelantado el 1 de " + MESES[mesIdxNuevo] };
    }

    if (esc === "puntual") {
      const dia = Math.max(2, inm.diaPago - 1);
      eventos.push({
        dia, tipo: "pago",
        titulo: inm.inquilino.nombre.split(" ")[0] + " pagó " + viaPago,
        detalle: inm.nombre + " · " + fmt(inm.canon) + " entró a la cuenta de Rentia",
      });
      gestiones.push({ fecha: dia + " " + mesAbrev, texto: "Pago recibido " + viaPago + " · " + fmt(inm.canon) });
      cobro = { estado: "pagado", texto: inm.inquilino.nombre.split(" ")[0] + " pagó el " + dia + " de " + MESES[mesIdxNuevo], codigo: null, gestiones };
      if (inm.plan === "gestion") {
        eventos.push({
          dia: dia + 1, tipo: "desembolso",
          titulo: "Te transferimos el recaudo: " + fmt(neto),
          detalle: inm.nombre + " · canon " + fmt(inm.canon) + " − tarifa " + fmt(tarifa),
        });
        historial.push({ fecha: (dia + 1) + " " + mesAbrev, concepto: "Recaudo transferido", monto: neto });
        desembolso = { estado: "pagado", texto: "Transferido el " + (dia + 1) + " de " + MESES[mesIdxNuevo] };
      }
    }

    if (esc === "tarde") {
      const d1 = inm.diaPago, d2 = inm.diaPago + 4, d3 = inm.diaPago + 9;
      eventos.push({ dia: d1, tipo: "gestion", titulo: "Recordatorio por WhatsApp a " + inm.inquilino.nombre.split(" ")[0], detalle: inm.nombre + " · no ha pagado y hoy es su fecha límite" });
      eventos.push({ dia: d2, tipo: "gestion", titulo: "Nuestro equipo llamó a " + inm.inquilino.nombre.split(" ")[0], detalle: inm.nombre + " · se comprometió a pagar esta semana" });
      if (inm.inquilino.metodo === "efectivo") {
        eventos.push({ dia: d2, tipo: "gestion", titulo: "Le enviamos un código para pagar en efectivo", detalle: "Válido en Efecty, Baloto y SuperGIROS" });
        gestionesHechas++;
      }
      eventos.push({
        dia: d3, tipo: "pago",
        titulo: inm.inquilino.nombre.split(" ")[0] + " pagó (tarde) " + viaPago,
        detalle: inm.nombre + " · " + fmt(inm.canon) + " entró a la cuenta de Rentia",
      });
      gestionesHechas += 2;
      gestiones.push({ fecha: d1 + " " + mesAbrev, texto: "Recordatorio automático enviado por WhatsApp" });
      gestiones.push({ fecha: d2 + " " + mesAbrev, texto: "Llamada de nuestro equipo de cobranza" });
      gestiones.push({ fecha: d3 + " " + mesAbrev, texto: "Pago recibido " + viaPago + " · " + fmt(inm.canon) });
      cobro = { estado: "pagado", texto: inm.inquilino.nombre.split(" ")[0] + " pagó tarde, el " + d3 + " de " + MESES[mesIdxNuevo], codigo: null, gestiones };
      if (inm.plan === "garantizado") {
        eventos.push({
          dia: d3, tipo: "escudo",
          titulo: "A ti no te afectó el retraso",
          detalle: inm.nombre + " · tu adelanto llegó el día 1, nueve días antes de este pago",
        });
      } else {
        eventos.push({
          dia: d3 + 1, tipo: "desembolso",
          titulo: "Te transferimos el recaudo: " + fmt(neto),
          detalle: inm.nombre + " · llegó tarde porque el plan Solo Gestión depende del inquilino",
        });
        historial.push({ fecha: (d3 + 1) + " " + mesAbrev, concepto: "Recaudo transferido", monto: neto });
        desembolso = { estado: "pagado", texto: "Transferido el " + (d3 + 1) + " de " + MESES[mesIdxNuevo] };
      }
    }

    if (esc === "mora") {
      const d1 = inm.diaPago, d2 = inm.diaPago + 4, d3 = inm.diaPago + 10;
      eventos.push({ dia: d1, tipo: "gestion", titulo: "Recordatorio por WhatsApp a " + inm.inquilino.nombre.split(" ")[0], detalle: inm.nombre + " · fecha límite de pago" });
      eventos.push({ dia: d2, tipo: "gestion", titulo: "Llamada de cobranza a " + inm.inquilino.nombre.split(" ")[0], detalle: inm.nombre + " · sin respuesta, se agenda seguimiento" });
      eventos.push({ dia: d3, tipo: "gestion", titulo: "Compromiso de pago firmado", detalle: inm.nombre + " · acuerdo para ponerse al día el próximo mes" });
      gestionesHechas += 3;
      gestiones.push({ fecha: d1 + " " + mesAbrev, texto: "Recordatorio automático enviado por WhatsApp" });
      gestiones.push({ fecha: d2 + " " + mesAbrev, texto: "Llamada de nuestro equipo de cobranza" });
      gestiones.push({ fecha: d3 + " " + mesAbrev, texto: "Compromiso de pago acordado" });
      cobro = { estado: "mora", texto: inm.inquilino.nombre.split(" ")[0] + " quedó en mora este mes — seguimos gestionando", codigo: null, gestiones };
      if (inm.plan === "garantizado") {
        eventos.push({
          dia: 28, tipo: "escudo",
          titulo: "Mora del inquilino: Rentia asume el riesgo",
          detalle: inm.nombre + " · tu adelanto del día 1 no se toca. La cobranza es problema nuestro.",
        });
      } else {
        eventos.push({
          dia: 28, tipo: "alerta",
          titulo: "Sin recaudo este mes en " + inm.nombre,
          detalle: "Con Arriendo Garantizado habrías recibido " + fmt(inm.canon - tarifaDe(inm.canon, "garantizado")) + " el día 1.",
        });
        desembolso = { estado: "pendiente", texto: "Pendiente: la inquilina está en mora" };
      }
    }

    return { ...inm, historial, cobro, desembolso };
  });

  eventos.sort((a, b) => a.dia - b.dia);
  return {
    inmuebles: nuevos,
    eventos,
    resumen: { mesNombre, totalAdelantado, gestionesHechas },
  };
}

/* ============================================================
   Estado global
   ============================================================ */
const estadoInicial = {
  pantalla: "inicio",           // inicio | cobranza | simulador
  mesIdx: 6,                    // julio
  anio: 2026,
  inmuebles: INMUEBLES_INICIALES,
  cobranzaId: 2,
  sim: null,                    // { eventos, resumen } del último mes simulado
  mesesSimulados: 0,
  onboarding: false,
  toast: null,
};

function reducer(state, accion) {
  switch (accion.tipo) {
    case "IR": {
      const s = { ...state, pantalla: accion.pantalla };
      if (accion.cobranzaId) s.cobranzaId = accion.cobranzaId;
      return s;
    }
    case "ABRIR_ONBOARDING":
      return { ...state, onboarding: true };
    case "CERRAR_ONBOARDING":
      return { ...state, onboarding: false };
    case "AGREGAR_INMUEBLE": {
      const inm = accion.inmueble;
      return {
        ...state,
        inmuebles: [...state.inmuebles, inm],
        onboarding: false,
        pantalla: "inicio",
        toast: inm.plan === "garantizado"
          ? "¡Listo! Tu primer adelanto llega el 1 de " + MESES[(state.mesIdx + 1) % 12] + "."
          : "¡Listo! Empezamos a gestionar el cobro de este arriendo.",
      };
    }
    case "GENERAR_CODIGO": {
      const inmuebles = state.inmuebles.map((inm) => {
        if (inm.id !== accion.id) return inm;
        const ref = String(700000000000 + inm.id * 7919137 + state.mesIdx * 104729)
          .slice(0, 12).replace(/(\d{4})(?=\d)/g, "$1 ");
        return {
          ...inm,
          cobro: {
            ...inm.cobro,
            codigo: { convenio: "94512", ref, valor: inm.canon, vence: inm.diaPago + " de " + MESES[state.mesIdx] },
            gestiones: [...inm.cobro.gestiones, { fecha: "hoy", texto: "Código de pago en efectivo generado (Efecty · Baloto)" }],
          },
        };
      });
      return { ...state, inmuebles, toast: "Código de efectivo generado y enviado al inquilino." };
    }
    case "REGISTRAR_GESTION": {
      const inmuebles = state.inmuebles.map((inm) =>
        inm.id === accion.id
          ? { ...inm, cobro: { ...inm.cobro, gestiones: [...inm.cobro.gestiones, { fecha: "hoy", texto: accion.texto }] } }
          : inm
      );
      return { ...state, inmuebles, toast: accion.toast };
    }
    case "AVANZAR_MES": {
      const mesIdx = (state.mesIdx + 1) % 12;
      const anio = mesIdx === 0 ? state.anio + 1 : state.anio;
      const r = simularMes(state.inmuebles, mesIdx, anio);
      return {
        ...state, mesIdx, anio,
        inmuebles: r.inmuebles,
        sim: { eventos: r.eventos, resumen: r.resumen },
        mesesSimulados: state.mesesSimulados + 1,
      };
    }
    case "TOAST":
      return { ...state, toast: accion.texto };
    case "LIMPIAR_TOAST":
      return { ...state, toast: null };
    default:
      return state;
  }
}

  mas: "M12 4v16m8-8H4",
  escudo: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z",
  cheque: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z",

/* ============================================================
   Piezas pequeñas
   ============================================================ */
const Insignia = ({ tono, children }) => {
  const tonos = {
    verde: "bg-brote text-bosque",
    ambar: "bg-amber-100 text-amber-800",
    rojo: "bg-rose-100 text-rose-700",
    gris: "bg-marfil text-humo",
  };
  return (
    <span className={"inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold " + tonos[tono]}>
      {children}
    </span>
  );
};

const Toast = ({ texto, alCerrar }) => {
  useEffect(() => {
    const t = setTimeout(alCerrar, 3200);
    return () => clearTimeout(t);
  }, [texto]);
  return (
    <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center px-6 pointer-events-none">
      <div className="bg-tinta text-white text-sm font-medium rounded-xl px-4 py-3 shadow-lg max-w-md">
        {texto}
      </div>
    </div>
  );
};

/* ============================================================
   Dashboard del dueño
   ============================================================ */
function insigniaPrincipal(inm) {
  if (inm.plan === "garantizado") {
    if (inm.desembolso.estado === "adelantado") return <Insignia tono="verde">Adelantado ✓</Insignia>;
    return <Insignia tono="gris">Programado día 1</Insignia>;
  }
  if (inm.cobro.estado === "pagado") return <Insignia tono="verde">Pagado ✓</Insignia>;
  if (inm.cobro.estado === "mora") return <Insignia tono="rojo">En mora</Insignia>;
  return <Insignia tono="ambar">Cobrando al inquilino</Insignia>;
}

function TarjetaInmueble({ inm, mesIdx, dispatch }) {
  const [verHistorial, setVerHistorial] = useState(false);
  const neto = netoDe(inm);
  const proximoMes = MESES[(mesIdx + 1) % 12];
  const enProblemas = inm.cobro.estado !== "pagado";

  return (
    <article className="bg-white rounded-2xl shadow-tarjeta p-5">
      <div className="flex items-start justify-between gap-3">
        <div>
          <h3 className="font-bold text-tinta leading-snug">{inm.nombre}</h3>
          <p className="text-xs text-humo mt-0.5">{inm.direccion}</p>
        </div>
        {insigniaPrincipal(inm)}
      </div>

      <div className="mt-4 flex items-center justify-between text-sm">
        <span className="text-humo">Canon mensual</span>
        <span className="font-bold text-tinta num">{fmt(inm.canon)}</span>
      </div>
      <div className="mt-1.5 flex items-center justify-between text-sm">
        <span className="text-humo">Plan</span>
        <span className={"font-semibold " + (inm.plan === "garantizado" ? "text-bosque" : "text-humo")}>
          {inm.plan === "garantizado" ? "Arriendo Garantizado" : "Solo Gestión de Cobro"}
        </span>
      </div>

      {/* Estado del cobro al inquilino */}
      <div className={"mt-4 rounded-xl px-3.5 py-3 text-sm " + (
        inm.cobro.estado === "pagado" ? "bg-brote text-bosque" :
        inm.cobro.estado === "mora" ? "bg-rose-50 text-rose-800" : "bg-amber-50 text-amber-800"
      )}>
        <p className="font-medium">{inm.cobro.texto}</p>
        {inm.plan === "garantizado" && enProblemas && (
          <p className="mt-1.5 flex items-center gap-1.5 text-xs font-semibold text-bosque">
            <Icono d={IC.escudo} className="w-4 h-4" /> Esto no afecta tu pago: ya lo tienes.
          </p>
        )}
      </div>

      {/* Próximo desembolso */}
      <div className="mt-3 flex items-center justify-between rounded-xl border border-marfil px-3.5 py-3">
        <div>
          <p className="text-[11px] uppercase tracking-wide text-humo font-semibold">Próximo desembolso</p>
          <p className="text-sm text-tinta font-medium mt-0.5">
            {inm.plan === "garantizado" ? "1 de " + proximoMes : inm.desembolso.estado === "pendiente" ? "Cuando el inquilino pague" : "Con el próximo recaudo"}
          </p>
        </div>
        <p className="font-bold text-bosque num">{fmt(neto)}</p>
      </div>

      {inm.plan === "gestion" && inm.cobro.estado === "mora" && (
        <div className="mt-3 rounded-xl bg-bosque text-white px-3.5 py-3 text-sm">

function Inicio({ state, dispatch }) {

  const conNovedad = inmuebles.filter((i) => i.cobro.estado !== "pagado").length;

  return (
    <div className="flex flex-col gap-4">

        <div className="relative">
          <p className="text-sm font-medium text-white/80">Tu arriendo de {MESES[mesIdx]} ya está en tu cuenta</p>

          <p className="text-sm text-white/80 mt-1">
            Desembolsado el 1 de {MESES[mesIdx]} · {garantizados.length} {garantizados.length === 1 ? "inmueble garantizado" : "inmuebles garantizados"}
          </p>
          <div className="mt-4 inline-flex items-center gap-2 bg-white/10 rounded-full px-3.5 py-2 text-xs font-semibold">
            <Icono d={IC.escudo} className="w-4 h-4" />

          </div>
        </div>
      </section>

        {[
          ["1", "Te pagamos el día 1"],
          ["2", "Nosotros cobramos"],
          ["3", "Tú no persigues a nadie"],
        ].map(([n, t], i) => (
          <React.Fragment key={n}>

      <div className="flex items-center justify-between mt-1">

          <span className="text-xs font-semibold text-humo">

      >

          gestiones: [{ fecha: "hoy", texto: "Bienvenida enviada al inquilino por WhatsApp con sus opciones de pago" }],

        historial: [],

                <Icono d={IC.cheque} className="w-9 h-9" />
              </div>
              <h3 className="font-bold text-tinta text-xl mt-4">{f.nombre}</h3>
              <p className="text-sm text-humo mt-2 max-w-xs mx-auto">
                {f.plan === "garantizado"
                  ? "Tu arriendo queda garantizado. El primer adelanto de " + fmt(Number(f.canon) - tarifaG) + " llega a tu cuenta el 1 de " + MESES[(state.mesIdx + 1) % 12] + "."
                  : "Activamos la gestión de cobro. Te transferimos " + fmt(Number(f.canon) - tarifaC) + " apenas " + f.inqNombre.split(" ")[0] + " pague."}
              </p>
              <button onClick={confirmar} className="mt-6 w-full rounded-xl bg-bosque text-white font-bold py-3.5 hover:bg-selva transition-colors">
                Ir a mi tablero
              </button>
            </div>
          ) : paso === 1 ? (
            <React.Fragment>
              <Campo etiqueta="Nombre corto del inmueble">
                <input className={claseInput} placeholder="Ej: Apto 501 · Cedritos" value={f.nombre} onChange={set("nombre")} />
              </Campo>
              <Campo etiqueta="Dirección">
                <input className={claseInput} placeholder="Ej: Cl 140 # 12-34, Bogotá" value={f.direccion} onChange={set("direccion")} />
              </Campo>
              <Campo etiqueta="Valor del arriendo (canon mensual)">
                <div className="relative">
                  <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-humo text-sm">$</span>
                  <input
                    className={claseInput + " pl-8 num"}
                    inputMode="numeric"
                    placeholder="1.500.000"
                    value={f.canon ? Number(f.canon).toLocaleString("es-CO") : ""}
                    onChange={(e) => setF({ ...f, canon: Number(e.target.value.replace(/\D/g, "")) })}
                  />
                </div>
                {!canonValido && f.canon > 0 && <p className="text-xs text-rose-600 mt-1">Ingresa un canon de al menos $ 100.000.</p>}
              </Campo>
              <Campo etiqueta="Día de pago acordado con el inquilino">
                <select className={claseInput} value={f.diaPago} onChange={set("diaPago")}>
                  {Array.from({ length: 28 }, (_, i) => i + 1).map((d) => (
                    <option key={d} value={d}>Día {d} de cada mes</option>
                  ))}
                </select>
              </Campo>
              <button disabled={!paso1Ok} onClick={() => setPaso(2)}
                className="mt-2 rounded-xl bg-bosque text-white font-bold py-3.5 disabled:opacity-40 hover:bg-selva transition-colors">
                Continuar
              </button>
            </React.Fragment>
          ) : paso === 2 ? (
            <React.Fragment>
              <Campo etiqueta="Nombre del inquilino">
                <input className={claseInput} placeholder="Ej: Andrés Gómez" value={f.inqNombre} onChange={set("inqNombre")} />
              </Campo>
              <Campo etiqueta="Teléfono (WhatsApp)">
                <input className={claseInput} inputMode="tel" placeholder="Ej: 300 123 4567" value={f.inqTelefono} onChange={set("inqTelefono")} />
              </Campo>
              <Campo etiqueta="¿Cómo paga normalmente?">
                <div className="grid grid-cols-2 gap-2">
                  {[
                    ["transferencia", "🏦 Transferencia", "Nequi, PSE o banco"],
                    ["efectivo", "💵 Efectivo", "Le damos código Efecty/Baloto"],
                  ].map(([valor, titulo, det]) => (
                    <button key={valor} type="button" onClick={() => setF({ ...f, metodo: valor })}
                      className={"rounded-xl border-2 px-3 py-3 text-left transition-colors " + (
                        f.metodo === valor ? "border-bosque bg-brote" : "border-humo/20 bg-white"
                      )}>
                      <p className="text-sm font-bold text-tinta">{titulo}</p>
                      <p className="text-[11px] text-humo mt-0.5">{det}</p>
                    </button>
                  ))}
                </div>
              </Campo>
              <p className="text-xs text-humo bg-white rounded-xl px-3.5 py-3">
                Sea como sea que pague, el dinero entra a Rentia y a ti te llega por transferencia. Nunca recibes efectivo.
              </p>
              <div className="mt-2 flex gap-2">
                <button onClick={() => setPaso(1)} className="rounded-xl border border-humo/25 text-tinta font-semibold px-5 py-3.5">Atrás</button>
                <button disabled={!paso2Ok} onClick={() => setPaso(3)}
                  className="flex-1 rounded-xl bg-bosque text-white font-bold py-3.5 disabled:opacity-40 hover:bg-selva transition-colors">
                  Continuar
                </button>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <button type="button" onClick={() => setF({ ...f, plan: "garantizado" })}
                className={"rounded-2xl border-2 p-4 text-left transition-colors " + (f.plan === "garantizado" ? "border-bosque bg-white" : "border-humo/20 bg-white/60")}>
                <div className="flex items-center justify-between">
                  <p className="font-bold text-tinta">Arriendo Garantizado</p>
                  <Insignia tono="verde">Recomendado</Insignia>
                </div>
                <p className="text-sm text-humo mt-1.5">
                  Te adelantamos el arriendo <strong className="text-tinta">el día 1 de cada mes, pase lo que pase</strong>. Si el inquilino se atrasa o no paga, el riesgo es nuestro.
                </p>
                <p className="text-sm font-bold text-bosque mt-2 num">
                  {tarifaG ? "Tarifa fija: " + fmt(tarifaG) + "/mes · recibes " + fmt(Number(f.canon) - tarifaG) : "Tarifa fija mensual del 8% del canon"}
                </p>
              </button>
              <button type="button" onClick={() => setF({ ...f, plan: "gestion" })}
                className={"rounded-2xl border-2 p-4 text-left transition-colors " + (f.plan === "gestion" ? "border-bosque bg-white" : "border-humo/20 bg-white/60")}>
                <p className="font-bold text-tinta">Solo Gestión de Cobro</p>
                <p className="text-sm text-humo mt-1.5">
                  Nosotros perseguimos el pago por ti (recordatorios, llamadas, efectivo) y te transferimos <strong className="text-tinta">cuando el inquilino pague</strong>.
                </p>
                <p className="text-sm font-bold text-tinta mt-2 num">
                  {tarifaC ? "Tarifa: " + fmt(tarifaC) + "/mes · recibes " + fmt(Number(f.canon) - tarifaC) : "Tarifa mensual del 4% del canon"}
                </p>
              </button>
              <div className="mt-2 flex gap-2">
                <button onClick={() => setPaso(2)} className="rounded-xl border border-humo/25 text-tinta font-semibold px-5 py-3.5">Atrás</button>
                <button onClick={() => setListo(true)}
                  className="flex-1 rounded-xl bg-bosque text-white font-bold py-3.5 hover:bg-selva transition-colors">
                  {f.plan === "garantizado" ? "Garantizar mi arriendo" : "Activar gestión de cobro"}
                </button>
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Marco de la app
   ============================================================ */
function App() {
  const [state, dispatch] = useReducer(reducer, estadoInicial);
  const { pantalla } = state;

  const tabs = [
    { id: "inicio", nombre: "Inicio", icono: IC.casa },
    { id: "cobranza", nombre: "Cobranza", icono: IC.plata },
    { id: "simulador", nombre: "Simular", icono: IC.play },
  ];

  return (
    <div className="min-h-screen bg-marfil max-w-md mx-auto shadow-2xl relative">
      <header className="sticky top-0 z-30 bg-marfil/95 backdrop-blur px-5 pt-4 pb-3 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-xl bg-bosque text-white flex items-center justify-center font-extrabold text-lg" aria-hidden="true">R</div>
          <div>
            <p className="font-extrabold text-tinta leading-none tracking-tight">Rentia</p>
            <p className="text-[11px] text-humo leading-tight mt-0.5">Tu arriendo, garantizado</p>
          </div>
        </div>
        <span className="text-xs font-semibold text-humo bg-white rounded-full px-3 py-1.5 shadow-tarjeta num">
          {cap(MESES[state.mesIdx])} {state.anio}
        </span>
      </header>

      <main className="px-5 pb-32 pt-2">
        {pantalla === "inicio" && <Inicio state={state} dispatch={dispatch} />}
        {pantalla === "cobranza" && <Cobranza state={state} dispatch={dispatch} />}
        {pantalla === "simulador" && <Simulador state={state} dispatch={dispatch} />}
        <p className="text-center text-[11px] text-humo/70 mt-8">Prototipo de demostración · datos simulados en memoria</p>
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 flex justify-center" aria-label="Navegación principal">
        <div className="w-full max-w-md bg-white border-t border-marfil px-2 pb-[env(safe-area-inset-bottom)] grid grid-cols-4">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => dispatch({ tipo: "IR", pantalla: t.id })}
              className={"flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold transition-colors " + (
                pantalla === t.id ? "text-bosque" : "text-humo hover:text-tinta"
              )}
              aria-current={pantalla === t.id ? "page" : undefined}>
              <Icono d={t.icono} className="w-6 h-6" stroke={pantalla === t.id ? 2.2 : 1.8} />
              {t.nombre}
            </button>
          ))}
          <button onClick={() => dispatch({ tipo: "ABRIR_ONBOARDING" })}
            className="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold text-humo hover:text-tinta transition-colors">
            <span className="w-6 h-6 rounded-lg bg-bosque text-white flex items-center justify-center"><Icono d={IC.mas} className="w-4 h-4" stroke={2.4} /></span>
            Agregar
          </button>
        </div>
      </nav>

      {state.onboarding && <Onboarding state={state} dispatch={dispatch} />}
      {state.toast && <Toast texto={state.toast} alCerrar={() => dispatch({ tipo: "LIMPIAR_TOAST" })} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
